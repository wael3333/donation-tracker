<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>الحملة الأولى : واعتصموا بحبل الله</title>
  <title>Die erste Kampagne: Haltet euch fest am Seil Allahs</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      text-align: center;
      padding: 15px;
      position: relative;
    }

    /* اللوغو في الأعلى يمين */
    .logo {
      position: absolute;
      top: -10px;
      right: 5px;
      width: 20%;
      max-width: 200px;
      min-width: 80px;
    }

    .live-icon {
      position: fixed;
      left: 10px;
      top: 10px;
      background-color: red;
      color: white;
      padding: 5px 10px;
      font-size: 24px;
      font-weight: bold;
      border-radius: 15px;
      animation: blink 1s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 20px;
    }

    .ayah-box {
      font-size: 40px;
      margin-bottom: 20px;
      font-weight: bold;
      color: #333;
      min-height: 24px;
    }

    .progress-container {
      width: 90%;
      max-width: 900px;
      background-color: #ddd;
      border-radius: 20px;
      margin: 20px auto;
      height: 40px;
      position: relative;
    }

    .progress-bar {
      height: 100%;
      background-color: #4CAF50;
      border-radius: 20px;
      width: 0%;
      transition: width 0.5s;
    }

    .progress-percent {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-weight: bold;
      color: #fff;
      font-size: 30px;
    }

    .amount-display {
      margin-top: 20px;
      font-size: 24px;
      font-weight: bold;
    }

    table {
      margin: 20px auto;
      border-collapse: collapse;
      width: 100%;
      max-width: 900px;
      font-size: 20px;
      font-weight: bold;
    }

    th, td {
      padding: 10px;
      border: 1px solid #ccc;
    }

    @media (max-width: 600px) {
      .amount-display {
        font-size: 16px;
      }
      .progress-percent {
        font-size: 18px;
      }
      table th, table td {
        font-size: 12px;
        padding: 6px;
      }
      .logo {
        width: 120px;
      }
    }
  </style>
</head>
<body>
  <img src="logo.png" alt="شعار المسجد" class="logo">
  <div class="content">
    <div class="live-icon">LIVE</div>

  <h1 style="color: #4CAF50;">الحملة الأولى : واعتصموا بحبل الله</h1>
    <h1 style="color: #4CAF50;">Die erste Kampagne: Haltet euch fest am Seil Allahs</h1>
    <br>

    <div class="ayah-box" id="ayah-box"></div>

  

    <div class="progress-container">
      <div id="progress-bar" class="progress-bar"></div>
      <div id="progress-percent" class="progress-percent">0%</div>
    </div>

    <div class="amount-display">
      تم جمع: <span id="collected">0</span> من 250000 يورو <br><br>
      Gesammelt: <span id="collected-de">0</span> von 250000 €
    </div>

    <table>
      <thead>
        <tr>
          <th>المبلغ اليومي<br>Tagessumme (€)</th>
          <th>التاريخ <br>Datum </th>
        </tr>
      </thead>
      <tbody id="log-body"></tbody>
    </table>
  </div>

  <audio id="successSound" src="Takbier.mp3" preload="auto"></audio>

  <script>
    const airtableApiKey = "pat0TfchyTuPG7G7y.2cf581d46ecd3b5eb3c2c51685981893cec72e9ab09a36e1d23dfbd15800ee5a";
    const baseId = "appFr3seko6dEOI76";
    const tableName = "Spenden";

    let collected = 0;
    let total = 250000;

    let ayat = [
      "﴿ٱلَّذِينَ يُنفِقُونَ أَمْوَٰلَهُم بِٱللَّيْلِ وَٱلنَّهَارِ سِرًّا وَعَلَانِيَةً فَلَهُمْ أَجْرُهُمْ عِندَ رَبِّهِمْ﴾",
      "﴿وَمَا تُنفِقُوا۟ مِنْ خَيْرٍۢ فَإِنَّ ٱللَّهَ بِهِۦ عَلِيمٌ﴾",
      "﴿لَن تَنَالُوا۟ ٱلْبِرَّ حَتَّىٰ تُنفِقُوا۟ مِمَّا تُحِبُّونَ﴾",
      " قال رسول الله ﷺ: «الصدقة تطفئ الخطيئة كما يطفئ الماء النار»",
      "قال رسول الله ﷺ: «اتقوا النار ولو بشق تمرة»"
    ];

    function rotateAyat() {
      const ayahBox = document.getElementById('ayah-box');
      let index = 0;
      ayahBox.innerText = ayat[index];
      setInterval(() => {
        index = (index + 1) % ayat.length;
        ayahBox.innerText = ayat[index];
      }, 10000);
    }

    function updateProgress() {
      let percent = (collected / total) * 100;
      document.getElementById("progress-bar").style.width = percent + "%";
      document.getElementById("progress-percent").innerText = percent.toFixed(1) + "%";
      document.getElementById("collected").innerText = collected.toLocaleString();
      document.getElementById("collected-de").innerText = collected.toLocaleString();
    }

    function fetchTotalFromAirtable() {
      fetch(`https://api.airtable.com/v0/${baseId}/${tableName}?pageSize=100&sort[0][field]=timestamp&sort[0][direction]=desc`, {
        headers: { Authorization: `Bearer ${airtableApiKey}` }
      })
      .then(res => res.json())
      .then(data => {
        let sum = 0;
        const logBody = document.getElementById("log-body");
        logBody.innerHTML = "";

        data.records.forEach((r, i) => {
          if (r.fields.amount) sum += r.fields.amount;

          // آخر سجل فقط
          if (i === 0) {
            const row = `<tr>
                           <td>${r.fields.amount}</td>
                           <td>${new Date(r.fields.timestamp).toLocaleString('de-DE', { dateStyle: 'short' })}</td>
                         </tr>`;
            logBody.insertAdjacentHTML("beforeend", row);
          }
        });

        collected = sum;
        updateProgress();
      })
      .catch(err => console.error("فشل في قراءة مجموع التبرعات", err));
    }

    fetchTotalFromAirtable();
    setInterval(fetchTotalFromAirtable, 30000); // تحديث تلقائي كل 30 ثانية
    rotateAyat();
  </script>
</body>
</html>
